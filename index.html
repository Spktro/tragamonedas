<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Nuez de la Fortuna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: un gabinete arcade centrado con la palanca a la derecha; al ganar, un escenario a pantalla completa lo tapa y va revelando el premio por tiempos. */
:root {
  color-scheme: dark;
  --night: #0d0b14;
  --night-2: #1a1626;
  --cabinet: #c4122f;
  --cabinet-dark: #7d0a1d;
  --gold: #ffcb3d;
  --gold-dark: #a8791a;
  --reel: #f6ecd2;
  --reel-shade: #cbbf9f;
  --ink: #17121f;
  --text: #f4eee0;
  --muted: #9a92ad;

  --display: "Press Start 2P", "Courier New", monospace;
  --body: "VT323", "Courier New", monospace;

  --cell: clamp(58px, 21vw, 104px);
  --px: 4px;
  --backdrop:
    radial-gradient(circle at 50% 0%, #2a1433 0%, transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px),
    var(--night);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--backdrop);
  color: var(--text);
  font-family: var(--body);
  font-size: 22px;
  line-height: 1.2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding-inline: 16px;
  padding-block: 24px;
  overflow-x: hidden;
}
[hidden] { display: none !important; }

h1, h2, p { margin: 0; }

/* ---------- Juego ---------- */
.game {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 500px;
}

.machine {
  position: relative;
  background: var(--cabinet);
  border: var(--px) solid var(--ink);
  box-shadow:
    inset calc(var(--px) * -1) calc(var(--px) * -1) 0 var(--cabinet-dark),
    inset var(--px) var(--px) 0 #e8405a,
    0 var(--px) 0 var(--px) var(--ink),
    0 18px 0 -2px rgba(0,0,0,.45);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.marquee {
  background: var(--ink);
  border: var(--px) solid var(--gold);
  padding: 12px 8px 10px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.marquee h1 {
  font-family: var(--display);
  font-size: clamp(11px, 3.6vw, 17px);
  line-height: 1.5;
  color: var(--gold);
  text-shadow: 2px 2px 0 var(--cabinet);
  text-wrap: balance;
}
.bulbs { display: flex; justify-content: space-between; }
.bulbs i {
  width: 8px; height: 8px;
  background: var(--gold-dark);
}
.bulbs i:nth-child(odd)  { animation: bulb 1s steps(1) infinite; }
.bulbs i:nth-child(even) { animation: bulb 1s steps(1) infinite .5s; }
@keyframes bulb { 0%, 49% { background: var(--gold); box-shadow: 0 0 8px var(--gold); } 50%, 100% { background: var(--gold-dark); box-shadow: none; } }
.spinning .bulbs i, .winning .bulbs i { animation-duration: .25s; }

.window {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  background: var(--ink);
  border: var(--px) solid var(--ink);
  box-shadow: 0 0 0 var(--px) var(--gold);
  margin: var(--px);
}
.reel {
  height: calc(var(--cell) * 3);
  overflow: hidden;
  background: var(--reel);
  box-shadow: inset 0 calc(var(--cell) * .9) calc(var(--cell) * .5) calc(var(--cell) * -.6) rgba(23,18,31,.75),
              inset 0 calc(var(--cell) * -.9) calc(var(--cell) * .5) calc(var(--cell) * -.6) rgba(23,18,31,.75);
}
.strip { will-change: transform; }
.cell {
  height: var(--cell);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(var(--cell) * .58);
  line-height: 1;
  border-bottom: 2px dashed var(--reel-shade);
  user-select: none;
}
.reel.stopped { animation: thunk .18s steps(3); }
@keyframes thunk { 0% { transform: translateY(6px); } 100% { transform: none; } }

.payline {
  position: absolute;
  left: -10px; right: -10px;
  top: calc(var(--cell) * 1.5 - 2px);
  height: 4px;
  background: var(--gold);
  opacity: .55;
  pointer-events: none;
}
.payline::before, .payline::after {
  content: "";
  position: absolute; top: -6px;
  border: 8px solid transparent;
}
.payline::before { left: -6px; border-left-color: var(--gold); }
.payline::after  { right: -6px; border-right-color: var(--gold); }
.winning .payline { opacity: 1; animation: flash .2s steps(1) infinite; }
.winning .reel { animation: glow .2s steps(1) infinite; }
@keyframes flash { 50% { background: #fff; } }
@keyframes glow { 50% { background: #fff6b8; } }

.panel {
  background: var(--ink);
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.status {
  color: var(--gold);
  font-family: var(--display);
  font-size: clamp(9px, 2.8vw, 12px);
  line-height: 1.7;
  text-align: center;
  min-height: 3.4em;
  display: flex; align-items: center; justify-content: center;
  text-wrap: balance;
}
.status.oops { animation: blink .25s steps(1) 4; }
@keyframes blink { 50% { opacity: .2; } }

.coins {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--display);
  font-size: clamp(8px, 2.4vw, 10px);
  color: var(--muted);
}
.coin {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--gold);
  border: 3px solid var(--ink);
  box-shadow: 0 0 0 2px var(--gold-dark), inset -3px -3px 0 var(--gold-dark);
  transition: opacity .2s steps(2), transform .3s steps(3);
}
.coin.spent { opacity: .18; transform: translateY(4px); box-shadow: 0 0 0 2px var(--muted); background: var(--muted); }

/* ---------- Pantallas previas: inicio y minijuegos ---------- */
.screen {
  width: 100%;
  max-width: 500px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
}
.screen h2 {
  font-family: var(--display);
  font-size: clamp(11px, 3.4vw, 15px);
  line-height: 1.7;
  color: var(--gold);
  text-wrap: balance;
  min-height: 3.4em;
  display: flex; align-items: center;
}
.screen .big {
  font-family: var(--display);
  font-size: clamp(16px, 5.4vw, 26px);
  line-height: 1.5;
  color: var(--gold);
  text-shadow: 3px 3px 0 var(--cabinet);
  text-wrap: balance;
}
.screen p { max-width: 30ch; font-size: 26px; }
/* Cuento del comienzo */
.tale-art { display: flex; align-items: flex-end; justify-content: center; gap: 12px; height: 128px; }
.tnut { width: 44px; height: 44px; visibility: hidden; --dx: -60px; }
.tnut:nth-child(3) { --dx: 20px; }
.tnut:nth-child(4) { --dx: 90px; }
.tnut.on { visibility: visible; animation: pop .45s steps(5) both; }
.tnut.on.lost { animation: lost 1.2s steps(10) forwards; }
@keyframes lost {
  0% { transform: none; opacity: 1; }
  30% { transform: translate(calc(var(--dx) * .4), -46px) rotate(120deg); opacity: 1; }
  100% { transform: translate(var(--dx), 150px) rotate(420deg); opacity: 0; }
}
.screen .tale {
  min-height: 17em;
  max-width: 30em;
  display: flex;
  flex-direction: column;
  gap: 12px;
  font-family: var(--display);
  font-size: clamp(10px, 3vw, 14px);
  line-height: 1.8;
}
.screen .tale p { max-width: none; font-size: inherit; text-wrap: balance; }
.screen .tale p:first-child { color: var(--gold); font-size: 1.5em; text-shadow: 3px 3px 0 var(--cabinet); }
.sprite { image-rendering: pixelated; }
.hero { width: 128px; height: 128px; visibility: hidden; }
#hero.on { visibility: visible; animation: pop .45s steps(5) both, hop .6s steps(2) .45s infinite; }
#hero.on.sad { animation: sad .4s steps(2) infinite; }
@keyframes sad { 0% { transform: rotate(-4deg) translateY(4px); } 100% { transform: rotate(4deg) translateY(4px); } }
@keyframes hop { 50% { transform: translateY(-8px); } }
.btn {
  font-family: var(--display);
  font-size: 14px;
  color: var(--ink);
  background: var(--gold);
  border: var(--px) solid var(--ink);
  box-shadow: inset -4px -4px 0 var(--gold-dark), inset 4px 4px 0 #fff3b0, 0 0 0 var(--px) var(--gold-dark);
  padding: 16px 22px;
  cursor: pointer;
}
.btn:active { transform: translateY(3px); }
.btn:focus-visible { outline: 3px dashed var(--text); outline-offset: 6px; }

.goldbar {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--display);
  font-size: clamp(8px, 2.4vw, 10px);
  color: var(--muted);
}
.gnut { width: 32px; height: 32px; transition: opacity .2s steps(2); }
.gnut.off { opacity: .2; filter: grayscale(1); }
.gnut.got { animation: pop .45s steps(5); }

#cv {
  width: min(100%, 440px, 50vh);
  aspect-ratio: 4 / 5;
  image-rendering: pixelated;
  border: var(--px) solid var(--ink);
  box-shadow: 0 0 0 var(--px) var(--gold);
  touch-action: none;
  cursor: ew-resize;
  background: var(--night-2);
}

.forest {
  position: relative;
  width: min(100%, 500px, 60vh);
  aspect-ratio: 96 / 84;
  container-type: inline-size;
  overflow: hidden;
  border: var(--px) solid var(--ink);
  box-shadow: 0 0 0 var(--px) var(--gold);
  background: var(--night-2);
}
.forest .bg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.firefly {
  position: absolute;
  width: 1.05cqw; height: 1.05cqw;
  background: var(--gold);
  box-shadow: 0 0 6px 1px var(--gold);
  opacity: 0;
  pointer-events: none;
  animation: firefly 4s steps(10) infinite;
}
@keyframes firefly {
  0%, 100% { opacity: 0; transform: none; }
  25% { opacity: 1; }
  55% { opacity: .9; transform: translate(400%, -500%); }
  75% { opacity: 0; transform: translate(600%, -300%); }
}
.spot {
  position: absolute;
  padding: 0;
  background: none;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.spot::before { content: ""; position: absolute; inset: -12px; }
.spot .hide { display: block; width: 100%; }
.spot:not(:disabled) .hide { animation: peek 2.6s steps(2) infinite; }
.spot:nth-of-type(2n) .hide { animation-delay: -.9s; }
.spot:nth-of-type(3n) .hide { animation-delay: -1.7s; }
@keyframes peek { 0%, 88% { transform: none; } 94% { transform: translateY(-6%); } }
.spot.shake .hide { animation: rustle .5s steps(6); }
@keyframes rustle { 0%, 100% { transform: rotate(0); } 20%, 60% { transform: rotate(-8deg) translateX(-6%); } 40%, 80% { transform: rotate(8deg) translateX(6%); } }
.spot:disabled { cursor: default; }
.spot.done .hide { animation: none; filter: brightness(.6); }
.spot:focus-visible { outline: 3px dashed var(--gold); outline-offset: 4px; }
.spot .found { position: absolute; left: 50%; bottom: 100%; width: 0; display: flex; justify-content: center; pointer-events: none; }
.found img { width: 16.7cqw; flex: none; }
.found .prize { width: 12.5cqw; animation: prize .7s steps(7) both, bob 1s steps(2) .7s infinite; filter: drop-shadow(0 0 6px var(--gold)); }
@keyframes prize { 0% { transform: translateY(100%) scale(.2); } 60% { transform: translateY(-40%) scale(1.25); } 100% { transform: none; } }
.found .bob { animation: popout .5s steps(5) both, bob 1s steps(2) .5s infinite; }
@keyframes popout { 0% { transform: translateY(100%) scale(.2); opacity: 0; } 60% { transform: translateY(-30%); opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes bob { 50% { transform: translateY(-8%); } }
.found .hopaway { animation: hopaway 1.8s steps(14) forwards; }
@keyframes hopaway {
  0% { transform: translateY(100%) scale(.2); opacity: 0; }
  15% { transform: none; opacity: 1; }
  35% { transform: translate(60%, -80%); }
  50% { transform: translate(120%, 0); }
  68% { transform: translate(190%, -70%); opacity: 1; }
  100% { transform: translate(280%, 30%); opacity: 0; }
}
.found .flyaway { animation: flyaway 1.8s steps(14) forwards; }
@keyframes flyaway {
  0% { transform: translateY(100%) scale(.2); opacity: 0; }
  15% { transform: none; opacity: 1; }
  40% { transform: translate(-70%, -120%); }
  70% { transform: translate(90%, -260%); opacity: 1; }
  100% { transform: translate(-40%, -420%); opacity: 0; }
}

/* ---------- Minijuego 3: las bellotas (dónde quedó la nuez) ---------- */
.cups {
  position: relative;
  width: min(100%, 500px, 60vh);
  aspect-ratio: 96 / 70;
  container-type: inline-size;
  overflow: hidden;
  border: var(--px) solid var(--ink);
  box-shadow: 0 0 0 var(--px) var(--gold);
  background: var(--night-2);
}
.cups .bg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.cup {
  position: absolute;
  bottom: 22%;
  width: 17%;
  margin-left: -8.5%;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  z-index: 2;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: left var(--d, .4s) cubic-bezier(.4,0,.6,1), transform .25s steps(4);
}
.cup::before { content: ""; position: absolute; inset: -10px; }
.cup img { display: block; width: 100%; }
.cup.up { transform: translateY(-75%); }
.cup.arc-a img { animation: arc-a var(--d) linear; }
.cup.arc-b img { animation: arc-b var(--d) linear; }
@keyframes arc-a { 50% { transform: translateY(-40%); } }
@keyframes arc-b { 50% { transform: translateY(28%); } }
.cup:focus-visible { outline: 3px dashed var(--gold); outline-offset: 4px; }
.cupnut { position: absolute; bottom: 23%; width: 11%; margin-left: -5.5%; z-index: 1; filter: drop-shadow(0 0 6px var(--gold)); }
/* La ardilla mira desde adelante, a contraluz */
.shadow-sq {
  position: absolute; left: -5%; bottom: -5%;
  width: 34%;
  z-index: 3;
  pointer-events: none;
  transform-origin: bottom center;
  animation: idle 1.6s steps(2) infinite;
}
@keyframes idle { 50% { transform: scaleY(1.05); } }
.shadow-sq.hop { animation: sqhop .16s steps(3) 6 alternate; }
@keyframes sqhop { to { transform: translateY(-9%); } }
.shadow-sq.oops { animation: sad .12s steps(2) 8; }
.drop {
  position: absolute; left: 24%; bottom: 40%;
  width: 1.7cqw; height: 2.8cqw;
  background: #7fd1ff;
  border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
  z-index: 4;
  pointer-events: none;
  animation: drop .8s steps(8) forwards;
}
@keyframes drop { 0% { transform: none; opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

/* ---------- La máquina abandonada ---------- */
.story {
  max-width: 500px;
  min-height: 5.1em;
  font-family: var(--display);
  font-size: clamp(10px, 3vw, 13px);
  line-height: 1.7;
  color: var(--gold);
  text-align: center;
  text-wrap: balance;
  display: flex; align-items: center;
}
.machine.off { background: #4b2a31; box-shadow: 0 var(--px) 0 var(--px) var(--ink), 0 18px 0 -2px rgba(0,0,0,.45); }
.machine .marquee, .machine .window, .machine .panel { transition: filter .7s; }
.machine.off .marquee, .machine.off .window, .machine.off .panel { filter: grayscale(1) brightness(.38); }
.machine.off.lit1 .marquee, .machine.off.lit2 .window { filter: none; }
.machine.off .bulbs i { animation: none; }
.machine.off.lit1 .bulbs i:nth-child(odd)  { animation: bulb 1s steps(1) infinite; }
.machine.off.lit1 .bulbs i:nth-child(even) { animation: bulb 1s steps(1) infinite .5s; }
#grime { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.dirt {
  position: absolute;
  padding: 0; border: 0; background: none;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .2s steps(3);
}
.dirt img { display: block; width: 100%; }
.dirt.flip img { transform: scaleX(-1); }
.dirt.shake { animation: rustle .25s steps(4); }
.dirt.gone { pointer-events: none; animation: fall .6s steps(6) forwards; }
@keyframes fall { to { transform: translateY(60px) rotate(25deg); opacity: 0; } }
.tray { display: flex; align-items: center; gap: 18px; min-height: 64px; }
.tray button {
  width: 56px; height: 56px;
  padding: 0; border: 0;
  background: var(--nut-gold) center / contain no-repeat;
  image-rendering: pixelated;
  cursor: pointer;
  filter: drop-shadow(0 0 8px var(--gold));
  animation: hop .6s steps(2) infinite;
  transition: transform .45s cubic-bezier(.5,-0.3,.8,.6), opacity .45s;
}
.tray button:nth-child(2) { animation-delay: -.2s; }
.tray button:nth-child(3) { animation-delay: -.4s; }
.tray button.in { animation: none; transform: translateY(-160px) scale(.3); opacity: 0; pointer-events: none; }

/* El foquito de arriba de la máquina */
.foco {
  position: absolute; left: 50%; top: -24px;
  width: 30px; height: 24px;
  margin-left: -15px;
  background: #5a0d1a;
  border: var(--px) solid var(--ink);
  border-bottom: 0;
  border-radius: 14px 14px 0 0;
}
.machine.off .foco { background: #2a2026; }
.foco.blink { animation: foco .5s steps(2) 1; }
@keyframes foco { 0%, 100% { background: #5a0d1a; box-shadow: none; } 50% { background: #ff4d5e; box-shadow: 0 0 26px 10px #ff4d5e; } }
.foco.sirena { animation: sirena .45s steps(1) infinite; }
@keyframes sirena {
  0% { background: #ff4d5e; box-shadow: -20px -4px 28px 8px #ff4d5e; }
  50% { background: #ffcb3d; box-shadow: 20px -4px 28px 8px #ffcb3d; }
}

/* En la máquina, las fichas son las nueces doradas */
.coins .coin, .coins .coin.spent {
  width: 24px; height: 24px;
  border: 0; border-radius: 0; box-shadow: none;
  background: var(--nut-gold) center / contain no-repeat;
  image-rendering: pixelated;
}
.coins .coin.spent { opacity: .2; filter: grayscale(1); }
.cell .sym { height: 64%; image-rendering: pixelated; }
.inline-nut { height: 1.9em; vertical-align: middle; margin-left: .2em; }

/* ---------- Palanca ---------- */
.lever {
  position: relative;
  width: 52px;
  height: calc(var(--cell) * 3 + 20px);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.lever:disabled { cursor: default; }
.lever .base {
  position: absolute; left: 0; bottom: 18%;
  width: 22px; height: 44px;
  background: var(--gold-dark);
  border: var(--px) solid var(--ink);
}
.lever .rod {
  position: absolute; left: 20px; bottom: calc(18% + 16px);
  width: 16px;
  height: 62%;
  background: #cfd3da;
  border: var(--px) solid var(--ink);
  transform-origin: bottom center;
  transition: height .18s steps(4);
}
.lever .knob {
  position: absolute; left: 10px; top: 0;
  width: 36px; height: 36px;
  background: var(--gold);
  border: var(--px) solid var(--ink);
  box-shadow: inset -6px -6px 0 var(--gold-dark), inset 4px 4px 0 #fff3b0;
  transition: transform .18s steps(4);
}
.lever.pulled .knob { transform: translateY(calc(var(--cell) * 1.9)); }
.lever.pulled .rod { height: 8%; }
.lever:not(:disabled):not(.pulled) .knob { animation: nudge 1.2s steps(2) infinite; }
@keyframes nudge { 50% { transform: translateY(8px); } }
.lever:focus-visible { outline: 3px dashed var(--gold); outline-offset: 4px; }

.hint { color: var(--muted); text-align: center; min-height: 1.2em; }

/* ---------- Festejo ---------- */
.quake { animation: quake .12s linear infinite; }
@keyframes quake {
  0% { transform: translate(0, 0) rotate(0); }
  20% { transform: translate(-7px, 4px) rotate(-.6deg); }
  40% { transform: translate(6px, -5px) rotate(.5deg); }
  60% { transform: translate(-5px, -3px) rotate(.4deg); }
  80% { transform: translate(7px, 5px) rotate(-.5deg); }
  100% { transform: translate(0, 0) rotate(0); }
}
/* La ardilla festeja saltando del centro a los bordes */
.dancer {
  position: fixed; left: 50%;
  z-index: 6;
  width: 96px; height: 96px;
  margin-left: -48px;
  pointer-events: none;
  animation: dance-x 3.4s linear both;
}
.dancer i { display: block; animation: dance-flip 3.4s steps(1) both; }
.dancer img { display: block; width: 100%; animation: dance-hop .3s cubic-bezier(.2,.6,.4,1) infinite alternate; }
@keyframes dance-x { 0% { transform: translateX(0); } 25% { transform: translateX(-36vw); } 75% { transform: translateX(36vw); } 100% { transform: translateX(0); } }
@keyframes dance-flip { 0% { transform: scaleX(-1); } 25% { transform: scaleX(1); } 75% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
@keyframes dance-hop { from { transform: translateY(0); } to { transform: translateY(-46px); } }
.game.bye { opacity: 0; transition: opacity .7s; }

#flash {
  position: fixed; inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 5;
}
#flash.go { animation: strobe .9s steps(1) 1; }
@keyframes strobe { 0%, 30%, 60% { opacity: .85; } 15%, 45%, 75%, 100% { opacity: 0; } }

/* ---------- Escenario del premio ---------- */
.stage {
  position: fixed; inset: 0;
  z-index: 2;
  background: var(--backdrop);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: safe center;
  gap: clamp(12px, 2.4vh, 22px);
  padding: 20px 16px;
  text-align: center;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .6s;
}
.stage.on { opacity: 1; visibility: visible; pointer-events: auto; }

.cue { visibility: hidden; }
.cue.on { visibility: visible; animation: pop .45s steps(5) both; }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: none; opacity: 1; } }

/* El cartel de arriba: primero JACKPOT, después el premio, en el mismo lugar */
.headline { display: grid; place-items: center; width: 100%; max-width: 1200px; }
.headline > * { grid-area: 1 / 1; }
.jackpot {
  font-family: var(--display);
  font-size: clamp(22px, 8vw, 54px);
  color: var(--gold);
  text-shadow: 3px 3px 0 var(--cabinet), 6px 6px 0 var(--ink);
  animation: throb .5s steps(2) infinite;
}
@keyframes throb { 50% { transform: scale(1.06); color: #fff; } }
.pre { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.pre.off, .pre.off .cue.on { visibility: hidden; animation: none; }
.pre.off .jackpot { animation: none; }
.tease {
  font-family: var(--display);
  font-size: clamp(11px, 3.4vw, 20px);
  line-height: 1.7;
  color: var(--text);
  text-wrap: balance;
}
.win { display: flex; flex-direction: column; gap: 10px; }
.win .lead {
  font-family: var(--display);
  font-size: clamp(14px, 4.6vw, 32px);
  line-height: 1.6;
  color: var(--gold);
  text-shadow: 2px 2px 0 var(--ink);
  text-wrap: balance;
}
.win .band {
  font-family: var(--display);
  font-size: clamp(28px, min(7.4vw, 13vh), 96px);
  line-height: 1.25;
  color: #fff;
  text-shadow: 4px 4px 0 var(--cabinet), 8px 8px 0 var(--ink);
  text-wrap: balance;
}
.win .band.on { animation: pop .45s steps(5) both, jitter .14s steps(2) .45s infinite; }
@keyframes jitter {
  0% { transform: translate(-3px, 2px) rotate(-.5deg); }
  50% { transform: translate(3px, -2px) rotate(.5deg); }
  100% { transform: translate(-2px, -3px) rotate(0); }
}
.ticket {
  display: inline-flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px 14px;
  background: var(--reel);
  color: var(--ink);
  font-family: var(--display);
  font-size: clamp(12px, 4vw, 22px);
  line-height: 1.6;
  padding: 12px 26px;
  border: var(--px) solid var(--ink);
  box-shadow: 0 0 0 var(--px) var(--gold);
  -webkit-mask: radial-gradient(circle 9px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 9px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
          mask: radial-gradient(circle 9px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 9px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
}
.video {
  position: relative;
  width: 100%;
  max-width: min(760px, 72vh);
  aspect-ratio: 16 / 9;
  background: #000;
  border: var(--px) solid var(--ink);

.video.on { opacity: 1; }
.video.rumble { animation: quake .09s linear 12; }

.video.tap iframe { pointer-events: auto; }

.help { color: var(--gold); }

function pix(emoji) {
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  const g = c.getContext('2d');
  g.font = '13px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';

  for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] > 90 ? 255 : 0;
  g.putImageData(d, 0, 0);

// Fondo de bosque de noche, pintado píxel por píxel (siempre igual: la "suerte" tiene semilla fija)
function paintForest(W, H, ground, big) {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const px = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
  const disc = (cx, cy, r, col) => { for (let y = -r; y <= r; y++) { const w = Math.round(Math.sqrt(r * r - y * y)); px(cx - w, cy + y, w * 2, 1, col); } };
  const pine = (cx, base, h, col) => {
    const tier = h / 3;
    for (let i = 0; i < h; i++) { const w = 1 + Math.floor((i % tier) * .8) + Math.floor(i / tier) * 2; px(cx - w, base - h + i, w * 2, 1, col); }
  };
  px(0, 0, W, ground, '#120f24');
  px(0, ground * .35, W, ground, '#1a1638');
  px(0, ground * .7, W, ground, '#231d47');
  for (let i = 0; i < 28; i++) px(rnd() * W, rnd() * ground * .75, 1, 1, '#f4eee0');
  const mx = Math.round(W * .74), my = Math.round(ground * .24);
  disc(mx, my, 7, '#f6ecd2'); px(mx - 3, my - 2, 2, 2, '#cbbf9f'); px(mx + 2, my + 2, 2, 1, '#cbbf9f'); px(mx + 1, my - 4, 1, 1, '#cbbf9f');
  for (let x = -4; x < W + 8; x += 9) pine(x + rnd() * 3, ground + 1, 15 + rnd() * 10, '#151c36');
  for (let x = 5; x < W + 8; x += 13) pine(x + rnd() * 4, ground + 2, 22 + rnd() * 10, '#123222');
  px(0, ground, W, H - ground, '#1b4a2a');
  px(0, ground, W, 2, '#2f8f46');
  px(0, ground + (H - ground) * .55, W, H, '#17402a');
  for (let i = 0; i < 46; i++) px(rnd() * W, ground + 3 + rnd() * (H - ground - 4), 1, 1, '#2f8f46');
  for (let i = 0; i < 7; i++) px(rnd() * W, ground + 4 + rnd() * (H - ground - 6), 1, 1, i % 2 ? '#ffcb3d' : '#f6ecd2');
  if (big) {
    const trunk = (x0, w, bottom) => {
      px(x0, 0, w, bottom, '#6b3f1d');
      for (let i = 0; i < w * 1.6; i++) px(x0 + 1 + rnd() * (w - 3), rnd() * bottom, 1, 3 + rnd() * 5, i % 3 ? '#8a5a2b' : '#4f2d14');
      px(x0, 0, 1, bottom, INK); px(x0 + w - 1, 0, 1, bottom, INK);
      px(x0 - 2, bottom - 2, w + 4, 2, '#6b3f1d'); px(x0 - 3, bottom, w + 6, 1, INK);
    };
    trunk(8, 14, 66);
    disc(15, 2, 12, '#1f5f30'); disc(3, 9, 9, '#1f5f30'); disc(29, 7, 9, '#1f5f30'); disc(12, 0, 6, '#2f8f46'); disc(28, 4, 4, '#2f8f46');
    trunk(85, 7, 60);
    disc(88, 3, 10, '#1f5f30'); disc(95, 11, 7, '#1f5f30'); disc(78, 8, 7, '#1f5f30'); disc(86, 1, 5, '#2f8f46');
  }
  return c;
}

// ---------- Sonido (sintetizado, sin archivos) ----------
let ctx;
function beep(freq, dur = .08, type = 'square', vol = .06, when = 0) {
  if (!ctx) return;
  const t = ctx.currentTime + when;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(ctx.destination);
  o.start(t); o.stop(t + dur);
}

}

// --- Minijuego 1: la ardilla ataja las nueces que caen ---
const G1 = { W: 120, H: 150, x: 60, tx: 60, dir: 1, nuts: [], got: 0, over: false, keys: {} };
function playCatch() {
  go('g1');
  const cv = $('cv'), g = cv.getContext('2d'), { W, H } = G1, need = CONFIG.nuecesComunes;
  cv.width = W; cv.height = H;
  const msg = t => { $('g1msg').textContent = t; };
  msg(`MOVÉ LA ARDILLA Y ATAJÁ ${need} NUECES`);
  const stars = Array.from({ length: 14 }, () => [Math.floor(Math.random() * W), Math.floor(Math.random() * H * .45)]);
  const aim = e => { const r = cv.getBoundingClientRect(); G1.tx = (e.clientX - r.left) / r.width * W; };
  cv.addEventListener('pointerdown', aim);
  cv.addEventListener('pointermove', aim);
  const key = down => e => {
    if (e.key === 'ArrowLeft') G1.keys.l = down;
    if (e.key === 'ArrowRight') G1.keys.r = down;
  };
  addEventListener('keydown', key(true));
  addEventListener('keyup', key(false));

  const floorY = H - 10, top = floorY - 16, fondo = paintForest(W, H, floorY, false);
  let last = performance.now(), spawn = .6, blink = 0;
  (function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; blink += dt;
    if (G1.keys.l) G1.tx = G1.x - 20;
    if (G1.keys.r) G1.tx = G1.x + 20;
    G1.tx = Math.max(8, Math.min(W - 8, G1.tx));
    const dx = G1.tx - G1.x;
    if (Math.abs(dx) > .5) { G1.dir = dx > 0 ? 1 : -1; G1.x += Math.sign(dx) * Math.min(Math.abs(dx), 170 * dt); }

    spawn -= dt;
    if (spawn <= 0 && !G1.over) {
      if (G1.got < need) {
        G1.nuts.push({ x: 8 + Math.random() * (W - 16), y: -14, v: 42 + Math.random() * 18 });
        spawn = .7 + Math.random() * .45;
      } else if (!G1.nuts.some(n => n.gold)) {
        G1.nuts.push({ x: 12 + Math.random() * (W - 24), y: -12, v: 36, gold: true });
        spawn = .8;
      }
    }
    for (const n of G1.nuts) {
      n.y += n.v * dt;
      if (n.y + 14 >= top + 3 && n.y < floorY - 4 && Math.abs(n.x - G1.x) < 12) {
        n.dead = true;
        if (n.gold) {
          G1.over = true;
          ganarDorada();
          msg(`¡FELICIDADES! RECUPERASTE UNA NUEZ DORADA. AHORA SOLO FALTAN ${CONFIG.fichas - doradas}`);
          setTimeout(playHidden, 2600);
        } else if (G1.got < need) {
          G1.got++;
          beep(660 + G1.got * 60, .09, 'square', .08);
          msg(G1.got < need ? `NUECES: ${G1.got} DE ${need}` : '¡AHORA ATAJÁ LA DORADA!');
        }
      } else if (n.y > H) {
        n.dead = true;
        if (n.gold) msg('¡SE ESCAPÓ! AHÍ VIENE OTRA');
      }
    }
    G1.nuts = G1.nuts.filter(n => !n.dead);

    g.drawImage(fondo, 0, 0);
    g.fillStyle = '#f4eee0'; stars.forEach(([x, y], i) => { if ((i + Math.floor(blink * 2)) % 5 === 0) g.fillRect(x, y, 1, 1); });
    for (const n of G1.nuts) {
      g.drawImage(n.gold ? SPR.gold : SPR.nut, Math.round(n.x - 7), Math.round(n.y));
      if (n.gold && Math.floor(blink * 8) % 2) {
        g.fillStyle = '#fff';
        g.fillRect(Math.round(n.x - 10), Math.round(n.y + 2), 1, 1);
        g.fillRect(Math.round(n.x + 9), Math.round(n.y + 9), 1, 1);
        g.fillRect(Math.round(n.x + 6), Math.round(n.y - 2), 1, 1);
      }
    }
    g.save();
    g.translate(Math.round(G1.x), top);
    g.scale(G1.dir, 1);
    g.drawImage(SPR.squirrel, -8, 0);
    g.restore();
    if (!G1.over) requestAnimationFrame(loop);
  })(last);
}

// --- Minijuego 3: las bellotas. La nuez queda debajo de una, se mezclan y hay que seguirla ---
function playCups() {
  go('g3');
  const msg = t => { $('g3msg').textContent = t; };
  const scene = $('cups'), SLOTS = [40, 61, 82], need = CONFIG.aciertosBellotas;
  scene.innerHTML = '';
  const bg = paintForest(96, 70, 46, false);
  bg.className = 'bg';
  scene.appendChild(bg);
  scene.insertAdjacentHTML('beforeend',
    `<img class="sprite cupnut" alt="" src="${SPR.gold.url}"><img class="sprite shadow-sq" id="sq" alt="" src="${silueta(SPR.squirrel)}">`);
  const nut = scene.querySelector('.cupnut'), sq = $('sq');
  const pos = [0, 1, 2];                       // pos[bellota] = lugar que ocupa
  let gold = 0, aciertos = 0, lento = 0, locked = true;
  const cups = SLOTS.map((x, i) => {
    const b = document.createElement('button');
    b.className = 'cup'; b.type = 'button';
    b.setAttribute('aria-label', 'Bellota ' + (i + 1));
    b.style.left = x + '%';
    b.innerHTML = `<img class="sprite" alt="" src="${SPR.bellota.url}">`;
    b.addEventListener('click', () => choose(i));
    scene.appendChild(b);
    return b;
  });
  const act = cls => { sq.classList.remove('hop', 'oops'); sq.getBoundingClientRect(); sq.classList.add(cls); };
  const showNut = () => { nut.style.left = SLOTS[pos[gold]] + '%'; nut.hidden = false; };

  async function ronda() {
    locked = true;
    gold = Math.floor(Math.random() * 3);
    msg(`MIRÁ BIEN DÓNDE QUEDA LA NUEZ (${aciertos + 1} DE ${need})`);
    showNut();
    cups[gold].classList.add('up');
    await wait(1300);
    cups[gold].classList.remove('up');
    await wait(450);
    nut.hidden = true;
    const cambios = 4 + aciertos * 2, dur = Math.max(240, 440 - aciertos * 80) + lento;
    scene.style.setProperty('--d', dur + 'ms');
    for (let k = 0; k < cambios; k++) {
      const a = Math.floor(Math.random() * 3), b = (a + 1 + Math.floor(Math.random() * 2)) % 3;
      [pos[a], pos[b]] = [pos[b], pos[a]];
      cups[a].classList.add('arc-a'); cups[b].classList.add('arc-b');
      cups[a].style.left = SLOTS[pos[a]] + '%'; cups[b].style.left = SLOTS[pos[b]] + '%';
      beep(300 + k * 30, .05, 'square', .04);
      await wait(dur + 70);
      cups[a].classList.remove('arc-a'); cups[b].classList.remove('arc-b');
    }
    msg('¿DÓNDE QUEDÓ LA NUEZ DORADA?');
    locked = false;
  }
  async function choose(i) {
    if (locked) return;
    locked = true;
    showNut();
    cups[i].classList.add('up');
    if (i === gold) {
      aciertos++;
      lento = 0;
      act('hop');
      beep(880, .08, 'square', .08); beep(1175, .08, 'square', .08, .09); beep(1568, .2, 'square', .08, .18);
      if (aciertos >= need) {
        ganarDorada();
        if (!reduced) confetti(2500);
        msg(`¡FELICIDADES! RECUPERASTE LAS ${CONFIG.fichas} NUECES DORADAS`);
        setTimeout(startSlot, 3000);
        return;
      }
      msg(`¡AHÍ ESTABA! VAN ${aciertos} DE ${need}`);
      await wait(1400);
      cups[i].classList.remove('up');
      await wait(450);
      ronda();
    } else {
      act('oops');
      for (let k = 0; k < 4; k++) scene.insertAdjacentHTML('beforeend',
        `<i class="drop" style="--dx:${-30 + k * 22}px;--dy:${-34 - (k % 2) * 16}px;animation-delay:${k * .08}s"></i>`);
      setTimeout(() => scene.querySelectorAll('.drop').forEach(d => d.remove()), 1300);
      womp();
      msg('¡UY, AHÍ NO ESTABA! OTRA VEZ, MÁS DESPACITO');
      await wait(800);
      cups[gold].classList.add('up');
      await wait(1300);
      cups[i].classList.remove('up'); cups[gold].classList.remove('up');
      await wait(450);
      lento += 170;
      ronda();
    }
  }
  ronda();
}

// final = [arriba, centro, abajo]; el centro es la línea de pago
// suspenso = el rodillo se va frenando, parece que la nuez se pasa de largo y a último momento vuelve y entra
function spinReel(i, duration, final, suspenso) {
  const reel = reels[i];
  const length = 56 + i * 24;
  // La tira baja: el final queda arriba de todo y lo que se ve ahora queda al fondo.
  // Con suspenso va un símbolo extra arriba, que es el que asoma cuando la nuez se pasa.
  const symbols = suspenso ? [rand(CONFIG.simbolos), ...final] : [...final];
  for (let k = 0; k < length; k++) symbols.push(rand(CONFIG.simbolos));
  symbols.push(...showing[i]);
  const strip = fill(reel, symbols);
  const cell = reel.clientHeight / 3;
  const justo = suspenso ? -cell : 0;      // posición en la que el final queda alineado
  const move = (ms, curve, y) => {
    strip.style.transition = `transform ${ms}ms ${curve}`;
    strip.style.transform = `translateY(${y}px)`;
  };

  reel.classList.remove('stopped');
  strip.style.transition = 'none';
  strip.style.transform = `translateY(${-(symbols.length - 3) * cell}px)`;
  strip.getBoundingClientRect();

  const land = () => {
    showing[i] = final;
    fill(reel, final).style.cssText = '';
    reel.classList.add('stopped');
    if (final[1] === T) { tin(i); foco('blink'); } else tok();
  };
  if (!suspenso) {
    move(duration, 'cubic-bezier(.12,.55,.2,1)', justo);
    return wait(duration).then(land);
  }
  return (async () => {
    // 1. frena de a poco y la nuez ya queda medio lugar pasada de la línea
    move(duration, 'cubic-bezier(.1,.5,.15,1)', justo + cell * .5);
    let gap = 110, lento = true;
    setTimeout(function tick() {
      if (!lento) return;
      beep(330, .03, 'square', .03);
      gap *= 1.1;
      setTimeout(tick, gap);
    }, duration * .6);
    await wait(duration);
    lento = false;
    // 2. se sigue arrastrando: parece que se pasa del todo
    statusEl.textContent = CONFIG.sePasa;
    statusEl.classList.add('oops');
    move(1500, 'linear', justo + cell * .85);
    [0, 480, 960, 1440].forEach(t => setTimeout(() => { beep(70, .14, 'sine', .3); beep(55, .1, 'sine', .25, .16); }, t));
    await wait(1500 + 500);
    // 3. ...y a último momento vuelve y entra
    statusEl.classList.remove('oops');
    [400, 600, 900, 1300].forEach((f, k) => beep(f, .06, 'square', .06, k * .05));
    move(330, 'cubic-bezier(.3,1.7,.5,1)', justo);
    await wait(350);
    land();
  })();
}

// Qué sale en cada tiro: los fallidos se quedan cada vez más cerca, el último gana.
function outcome(restantes) {
  const o = () => rand(CONFIG.simbolos);
  if (restantes === 0) return [[o(), T, o()], [o(), T, o()], [o(), T, o()]];
  if (restantes === 1) return [[o(), T, o()], [o(), T, o()], [o(), o(), T]];   // el tercero se pasa por uno
  return [[o(), T, o()], [o(), o(), o()], [T, o(), o()]];
}

let busy = false;
async function pull() {
  if (busy || !lista || fichas === 0) return;
  busy = true;
  lever.disabled = true;
  audio();

  fichas--;
  renderFichas();
  lever.classList.add('pulled');
  beep(140, .15, 'sawtooth', .08);
  setTimeout(() => lever.classList.remove('pulled'), 380);
  statusEl.classList.remove('oops');
  const ultima = fichas === 0;
  statusEl.textContent = ultima ? CONFIG.ultimaTirada : '. . .';
  machine.classList.add('spinning');

  const ticker = setInterval(() => beep(330 + Math.random() * 60, .03, 'square', .025), 95);
  const base = reduced ? 500 : 4200, paso = reduced ? 300 : 1800;
  const finals = outcome(fichas);
  await Promise.all(reels.map((_, i) => {
    const suspenso = ultima && i === reels.length - 1 && !reduced;
    return spinReel(i, base + i * paso + (suspenso ? 1600 : 0), finals[i], suspenso).then(() => {
      if (ultima && i === reels.length - 2) { clearInterval(ticker); statusEl.textContent = CONFIG.faltaUna; }
    });
  }));
  clearInterval(ticker);
  machine.classList.remove('spinning');

  if (fichas > 0) {
    await wait(350);
    womp();
    statusEl.textContent = CONFIG.perdiste[CONFIG.fichas - fichas - 1] || 'SEGUÍ INTENTANDO';
    statusEl.classList.add('oops');
    lever.disabled = false;
    busy = false;
    return;
  }
  celebrate();
}
lever.addEventListener('click', pull);
machine.addEventListener('click', pull);

// ---------- Festejo y premio ----------
async function celebrate() {
  statusEl.textContent = '¡¡¡NUEZ, NUEZ, NUEZ!!!';
  $('hint').textContent = '';
  machine.classList.add('winning');
  $('foco').classList.add('sirena');
  fanfare();
  if (!reduced) {
    $('game').classList.add('quake');
    $('flash').classList.remove('go'); $('flash').getBoundingClientRect(); $('flash').classList.add('go');
    confetti(5000);
  }
  await wait(reduced ? 2200 : 1200);
  $('game').classList.remove('quake');
  if (!reduced) {
    // la ardilla aparece arriba de la máquina, feliz, y salta de lado a lado
    const d = document.createElement('div');
    d.className = 'dancer';
    d.style.top = Math.max(4, machine.getBoundingClientRect().top - 84) + 'px';
    d.innerHTML = `<i><img class="sprite" alt="" src="${SPR.feliz.url}"></i>`;
    document.body.appendChild(d);
    let salto = 0;
    const saltitos = setInterval(() => beep(salto++ % 2 ? 1047 : 880, .05, 'square', .05), 300);
    await wait(3400);
    $('game').classList.add('bye');
    await wait(900);
    clearInterval(saltitos);
    d.remove();
  }
  startShow();
}

let player, started = false, showAt = 0, lastT = -1, lastMove = 0, reloj = false, relojBase = 0, ended = false;
function startShow() {
  $('lead').textContent = CONFIG.lead;
  $('band').textContent = CONFIG.band;
  $('ticket').innerHTML = [CONFIG.fecha, CONFIG.lugar].filter(Boolean).map(t => `<span>${t}</span>`).join('');
  $('note').textContent = CONFIG.nota;
  $('tease1').innerHTML = CONFIG.intriga1 + ' ' + `<img class="sprite inline-nut" alt="" src="${SPR.gold.url}">`.repeat(3);
  $('tease2').textContent = CONFIG.intriga2;
  $('ytlink').href = `https://www.youtube.com/watch?v=${CONFIG.videoId}`;
  stage.classList.add('on');
  if (!reduced) $('jackpot').classList.add('quake');

  if (CONFIG.pedirToque) {
    // Los navegadores solo dejan arrancar video con sonido justo después de un toque:
    // por eso la música empieza con este botón y no sola.
    $('cobrar').hidden = false;
    $('cobrar').addEventListener('click', () => { $('cobrar').hidden = true; playShow(); }, { once: true });
  } else {
    playShow();
  }
}
function playShow() {
  beep(1319, .1, 'square', .08); beep(1976, .25, 'square', .08, .1);
  try { player.unMute(); player.setVolume(100); player.playVideo(); } catch (e) {}
  showAt = lastMove = performance.now();
  setInterval(tick, 200);
}

const cues = [
  ['intriga1En', () => show('tease1')],
  ['intriga2En', () => show('tease2', true)],
  ['videoAparece', () => $('video').classList.add('on')],
  ['premioEn', () => {
    $('pre').classList.add('off');
    show('lead');
    setTimeout(() => { show('band', true); if (!reduced) $('video').classList.add('rumble'); }, 700);
  }],
  ['fechaEn', () => show('ticket')],
  ['notaEn', () => show('note')],
];
function show(id, big) {
  $(id).classList.add('on');
  if (reduced) return;
  if (big) {
    confetti(7000);
    stage.classList.add('quake');
    setTimeout(() => stage.classList.remove('quake'), 1000);
  }
}
function tick() {
  const now = performance.now();
  let t = 0, state = 'sin reproductor';
  if (player && player.getPlayerState) {
    state = player.getPlayerState();
    t = player.getCurrentTime() || 0;
    if (state === 1) {
      if (!started) { started = true; try { player.unloadModule('captions'); } catch (e) {} }   // sin subtítulos automáticos
      $('video').classList.remove('tap');
      $('help').hidden = true;
    }
    if (state === 0) { ended = true; $('video').classList.remove('on'); }   // al terminar, fuera las sugerencias de YouTube
    if (t !== lastT) { lastT = t; lastMove = now; }
  }
  // Si el video no arranca o se queda trabado 4 segundos, el premio no se cuelga:
  // los carteles siguen con reloj propio y el video queda a la vista para tocarlo.
  if (!reloj && !ended && now - lastMove > 4000) {
    reloj = true;
    relojBase = now - t * 1000;
    $('video').classList.add('on', 'tap');
    $('help').hidden = false;
    try { player.playVideo(); } catch (e) {}
  }
  if (reloj && state !== 1) t = Math.max(t, (now - relojBase) / 1000);
  if (DEBUG) $('debug').textContent = `estado ${state}  t ${t.toFixed(1)}  arrancó ${started}  reloj ${reloj}\n${navigator.userAgent}`;
  while (cues.length && t >= CONFIG[cues[0][0]]) cues.shift()[1]();
}
// Diagnóstico: agregar ?debug al link muestra abajo qué está haciendo el reproductor
const DEBUG = location.search.includes('debug');
$('debug').hidden = !DEBUG;

// El reproductor se carga escondido desde el principio para que la música arranque al instante.
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('yt', {
    videoId: CONFIG.videoId,
    playerVars: { controls: 0, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, disablekb: 1, fs: 0, cc_load_policy: 0 },
  });
};
document.head.appendChild(Object.assign(document.createElement('script'), { src: 'https://www.youtube.com/iframe_api' }));

// ---------- Confeti pixelado ----------
let confettiRun = 0;
function confetti(ms) {
  const run = ++confettiRun;
  const c = $('confetti'), g = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colors = ['#ffcb3d', '#c4122f', '#f6ecd2', '#ffffff', '#e8405a'];
  const bits = Array.from({ length: 160 }, () => ({
    x: Math.random() * c.width, y: -Math.random() * c.height,
    s: 6 + Math.floor(Math.random() * 3) * 3,
    vy: 3 + Math.random() * 5, vx: -1 + Math.random() * 2, color: rand(colors),
  }));
  const end = performance.now() + ms;
  (function frame(now) {
    if (run !== confettiRun) return;
    g.clearRect(0, 0, c.width, c.height);
    const raining = now < end;
    let alive = false;
    for (const b of bits) {
      b.y += b.vy; b.x += b.vx;
      if (b.y > c.height && raining) { b.y = -20; b.x = Math.random() * c.width; }
      if (b.y <= c.height) alive = true;
      g.fillStyle = b.color;
      g.fillRect(Math.round(b.x / 3) * 3, Math.round(b.y / 3) * 3, b.s, b.s);
    }
    if (alive) requestAnimationFrame(frame); else g.clearRect(0, 0, c.width, c.height);
  })(performance.now());
}
