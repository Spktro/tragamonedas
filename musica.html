<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas de música</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root { color-scheme: dark; --night: #0d0b14; --night-2: #1a1626; --gold: #ffcb3d; --gold-dark: #a8791a; --ink: #17121f; --text: #f4eee0; --muted: #9a92ad; }
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px; background: var(--night); color: var(--text); font: 22px/1.3 "VT323", "Courier New", monospace; display: flex; flex-direction: column; align-items: center; gap: 18px; }
h1 { margin: 0; font: 16px/1.6 "Press Start 2P", monospace; color: var(--gold); text-align: center; }
p { margin: 0; max-width: 46ch; text-align: center; color: var(--muted); }
.list { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 12px; }
.track { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 14px; background: var(--night-2); border: 4px solid var(--ink); box-shadow: 0 0 0 2px var(--gold-dark); }
.track b { font: 12px/1.6 "Press Start 2P", monospace; color: var(--gold); }
.track span { grid-column: 2; color: var(--muted); }
button { grid-row: span 2; width: 64px; height: 64px; font: 20px "Press Start 2P", monospace; color: var(--ink); background: var(--gold); border: 4px solid var(--ink); box-shadow: inset -4px -4px 0 var(--gold-dark); cursor: pointer; }
button.on { background: #ff4d5e; box-shadow: inset -4px -4px 0 #a01a2b; }
button:focus-visible { outline: 3px dashed var(--text); outline-offset: 4px; }
</style>
</head>
<body>
<h1>MÚSICA PARA LOS MINIJUEGOS</h1>
<p>Tocá ▶ para escuchar cada loop y ■ para frenarlo. Decime cuáles te gustan y para qué juego.</p>
<div class="list" id="list"></div>

<script>
// Cada tema: 32 pasos (2 compases de semicorcheas). Números = nota MIDI, 0 = silencio.
const TEMAS = [
  {
    nombre: 'A · NOCHE DE NUECES', desc: 'Tranquilo y saltarín. Pensado para la ardilla que ataja.',
    bpm: 104, onda: 'square',
    lead: [72,0,76,0,79,0,76,0, 74,0,77,0,81,0,77,0, 72,0,76,0,79,0,84,0, 83,0,79,0,76,0,74,0],
    bajo: [48,0,0,0,55,0,0,0, 50,0,0,0,57,0,0,0, 45,0,0,0,52,0,0,0, 43,0,0,0,50,0,0,0],
    hat: 4,
  },
  {
    nombre: 'B · EL ZORRO PÍCARO', desc: 'Sigiloso, en puntas de pie. Pensado para buscar en el bosque.',
    bpm: 112, onda: 'triangle',
    lead: [69,0,0,72,0,0,71,0, 69,0,0,64,0,0,0,0, 69,0,0,72,0,0,74,0, 76,0,75,0,76,0,0,0],
    bajo: [45,0,0,0,52,0,0,0, 45,0,0,0,52,0,0,0, 41,0,0,0,48,0,0,0, 40,0,0,0,47,0,52,0],
    hat: 8,
  },
  {
    nombre: 'C · EL DESAFÍO DEL LOBO', desc: 'Rápido y tenso. Pensado para las bellotas.',
    bpm: 152, onda: 'square',
    lead: [76,76,0,76,79,0,76,0, 74,74,0,74,78,0,74,0, 72,72,0,72,76,0,72,0, 71,0,74,0,78,0,83,0],
    bajo: [40,0,40,0,40,0,40,0, 38,0,38,0,38,0,38,0, 36,0,36,0,36,0,36,0, 35,0,35,0,35,0,47,0],
    hat: 2,
  },
  {
    nombre: 'D · CLARO DE LUNA', desc: 'Lento y misterioso. Pensado para la máquina abandonada.',
    bpm: 84, onda: 'triangle',
    lead: [64,0,0,0,67,0,0,0, 71,0,0,0,67,0,0,0, 62,0,0,0,66,0,0,0, 69,0,0,0,66,0,64,0],
    bajo: [40,0,0,0,0,0,0,0, 47,0,0,0,0,0,0,0, 38,0,0,0,0,0,0,0, 45,0,0,0,0,0,0,0],
    hat: 0,
  },
  {
    nombre: 'E · ARDILLA AL TROTE', desc: 'Alegre y más movido. Alternativa para atajar nueces.',
    bpm: 132, onda: 'square',
    lead: [79,0,76,0,72,0,76,0, 79,0,84,0,83,0,79,0, 77,0,74,0,71,0,74,0, 77,0,79,0,76,0,0,0],
    bajo: [48,0,55,0,48,0,55,0, 48,0,55,0,48,0,55,0, 43,0,50,0,43,0,50,0, 43,0,50,0,48,0,55,0],
    hat: 2,
  },
];

let ctx, master, timer, sonando = null;
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function nota(freq, t, dur, tipo, vol) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = tipo; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + dur);
}
function hat(t) {
  const n = ctx.createBufferSource(), buf = ctx.createBuffer(1, 800, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const g = ctx.createGain();
  g.gain.value = .05;
  n.buffer = buf; n.connect(g).connect(master); n.start(t);
}
function parar() {
  clearTimeout(timer);
  if (master) { master.disconnect(); master = null; }
  document.querySelectorAll('button').forEach(b => { b.classList.remove('on'); b.textContent = '▶'; });
  sonando = null;
}
function tocar(i, boton) {
  const era = sonando;
  parar();
  if (era === i) return;
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  master = ctx.createGain();
  master.gain.value = .9;
  master.connect(ctx.destination);
  sonando = i;
  boton.classList.add('on'); boton.textContent = '■';
  const tema = TEMAS[i], paso = 60 / tema.bpm / 4;
  let inicio = ctx.currentTime + .08;
  (function vuelta() {
    for (let k = 0; k < 32; k++) {
      const t = inicio + k * paso;
      if (tema.lead[k]) nota(hz(tema.lead[k]), t, paso * 1.8, tema.onda, .07);
      if (tema.bajo[k]) nota(hz(tema.bajo[k]), t, paso * 3.2, 'triangle', .16);
      if (tema.hat && k % tema.hat === 0) hat(t);
    }
    inicio += 32 * paso;
    timer = setTimeout(vuelta, (inicio - ctx.currentTime - .15) * 1000);
  })();
}
TEMAS.forEach((t, i) => {
  const row = document.createElement('div');
  row.className = 'track';
  row.innerHTML = `<button type="button" aria-label="Escuchar ${t.nombre}">▶</button><b>${t.nombre}</b><span>${t.desc}</span>`;
  row.querySelector('button').addEventListener('click', e => tocar(i, e.currentTarget));
  document.getElementById('list').appendChild(row);
});
</script>
</body>
</html>
